set timeout=3
set default=0

# Configuracion de resolucion y modo de video VESA / LFB para Zenthra GUI
set gfxmode=1024x768x32,800x600x32,auto
set gfxpayload=keep
insmod all_video

menuentry "Zenthra OS (GUI Desktop Edition - 2026)" {
    multiboot /boot/zenthra_kernel.elf
    boot
}

menuentry "Zenthra OS (Automated CI Verification & Poweroff)" {
    multiboot /boot/zenthra_kernel.elf test-mode
    boot
}
