name: Zenthra OS CI - Build, Test, QEMU & ISO Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Instalar Dependencias (GCC Multilib, Clang, GRUB, xorriso, QEMU, mtools, dosfstools)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib build-essential grub-pc-bin grub-common xorriso qemu-system-x86 clang mtools dosfstools

      - name: Ejecutar Test Suite Unitario y de Protocolo
        run: |
          make clean
          make test

      - name: Compilar Kernel ELF y Generar Imagen ISO Arrancable
        run: |
          make iso
          echo "=== Hashes de Verificacion Criptografica SHA-256 ==="
          sha256sum build/zenthra_kernel.elf build/zenthra_os.iso
          cat build/BUILD_INFO.txt

      - name: Validar Arranque Automatizado en QEMU y Alternancia de Tareas
        run: |
          make verify-qemu

      - name: Subir Imagen ISO y Log Serial como Artefactos de Build
        uses: actions/upload-artifact@v4
        with:
          name: zenthra-os-artifacts
          path: |
            build/zenthra_os.iso
            build/zenthra_kernel.elf
            build/serial.log
            build/BUILD_INFO.txt
